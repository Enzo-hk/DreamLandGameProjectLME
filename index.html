<body>    
    <div id="bg" class="wp-block-cover ticss-a35902ec">
        <span aria-hidden="true" class="wp-block-cover__background has-custom-dark-blue-2-background-color has-background-dim-100 has-background-dim"></span>
        <div class="wp-block-cover__inner-container">
            <div class="bg-animation">
                <div id='stars'></div>
                <div id='stars2'></div>
                <div id='stars3'></div>
                <div id='stars4'></div>
            </div>
        </div>    
    </div>

    <div id="menu">
        <h1>DreamLand LME</h1>
        <div id="container">
            <button id="startGame">Jouer</button>
        </div>
    </div>


    <audio id="backgroundMusic" src="musics/dreamlandTitle.mp3" loop></audio>
    <canvas id="renderCanvas" touch-action="none"></canvas>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
        const backgroundMusic = document.getElementById('backgroundMusic');

        // Function to play the background music
        function playMusic() { 
            if (backgroundMusic) {
                backgroundMusic.play().catch(error => {
                    // Autoplay was prevented. This might happen in some browsers
                    // if the user hasn't interacted with the page yet.
                    console.error("Autoplay prevented:", error);
                    // You might want to add a button or other UI element
                    // to allow the user to initiate music playback.
                });
                backgroundMusic.loop = true; // Ensure looping in JS as well
            }
        }

        // Play the music when the page loads
        playMusic();

        // Optional: Add controls to pause/play the music
        // const playPauseButton = document.createElement('button');
        // playPauseButton.textContent = 'Play/Pause Music';
        // document.body.appendChild(playPauseButton);

        // playPauseButton.addEventListener('click', function() {
        //     if (backgroundMusic.paused) {
        //         backgroundMusic.play();
        //     } else {
        //         backgroundMusic.pause();
        //     }
        // });
    });
    </script>
    <script type="module" src="js/game.js"></script>
